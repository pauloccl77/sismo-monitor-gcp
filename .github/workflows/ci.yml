name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install ruff

      - run: ruff check ingestion pipeline alerting

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -r ingestion/requirements.txt pytest

      - run: pytest ingestion/ -v

  docker-build:
    name: Docker build + smoke test (poller)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t sismo-poller:ci ./ingestion

      - name: Smoke test — el módulo importa y arranca sin errores
        run: |
          docker run --rm -e GCP_PROJECT_ID=ci-smoke-test sismo-poller:ci \
            python -c "import poller; print('poller module OK')"

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - run: terraform fmt -check -recursive

      - run: terraform init

      - run: terraform validate

      - name: Terraform plan
        env:
          TF_VAR_project_id: sismo-monitor-pcl
          TF_VAR_region: us-central1
          TF_VAR_project_number: ${{ secrets.TF_VAR_PROJECT_NUMBER }}
          TF_VAR_billing_account_id: ${{ secrets.TF_VAR_BILLING_ACCOUNT_ID }}
          TF_VAR_alert_email_from: ${{ secrets.TF_VAR_ALERT_EMAIL_FROM }}
          TF_VAR_alert_email_to: ${{ secrets.TF_VAR_ALERT_EMAIL_TO }}
        run: terraform plan -input=false
